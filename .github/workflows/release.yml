name: Release selected tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.0.1; letters, digits, dots, underscores, and hyphens)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: '1.98.1'

jobs:
  resolve:
    name: Validate and resolve the selected tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Require the trusted default-branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo 'Run this workflow from the default branch; use the tag input to select the release source.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an existing tag and freeze its commit
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]; then
            echo 'Invalid tag: use 1–80 letters, digits, dots, underscores, or hyphens; start with a letter or digit.' >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$commit" >> "$GITHUB_OUTPUT"

  checks:
    name: Recheck selected commit
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.resolve.outputs.commit }}
      release_tag: ${{ needs.resolve.outputs.tag }}
    permissions:
      contents: read
      actions: read
      security-events: write

  cli:
    name: Package CLI (${{ matrix.target }})
    needs: [resolve, checks]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Build and package the CLI
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target "$RUST_TARGET"
          cargo install cargo-about --version 0.9.1 --locked --features cli
          if [[ "$RUST_TARGET" == x86_64-unknown-linux-gnu ]]; then
            # Use the pinned Debian 12 builder, so the Linux artifact requires
            # glibc 2.36 rather than the newer Ubuntu runner's glibc version.
            docker buildx build --target cli \
              --output "type=local,dest=target/$RUST_TARGET/release" .
          else
            cargo build --release --locked --bin ac-man --target "$RUST_TARGET"
          fi
          "target/$RUST_TARGET/release/ac-man" --help
          mkdir -p licenses
          cargo about generate --locked --fail --target "$RUST_TARGET" \
            -o licenses/DEPENDENCIES.html about.hbs
          ./scripts/package-release.sh cli "$RELEASE_TAG" "$RUST_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  container:
    name: Build and scan CLI container (${{ matrix.arch }})
    needs: [resolve, checks]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            trivy_arch: 64bit
            trivy_sha: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            trivy_arch: ARM64
            trivy_sha: aab21e677a7b7071fc79f1711480840754c18a1b9d9cefa7ccd06af63a0e8f4c
    # Build and execute the selected source without a package-write token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Build and smoke-test the native image
        env:
          ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo install cargo-about --version 0.9.1 --locked --features cli
          mkdir -p licenses
          cargo about generate --locked --fail --target "$RUST_TARGET" \
            -o licenses/DEPENDENCIES.html about.hbs
          docker build --platform "linux/$ARCH" --target runtime \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$RELEASE_COMMIT" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --tag "ac-man-release:$ARCH" .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges "ac-man-release:$ARCH" --help
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges "ac-man-release:$ARCH" --version
      - name: Install checksum-pinned Trivy
        env:
          TRIVY_ARCH: ${{ matrix.trivy_arch }}
          TRIVY_SHA: ${{ matrix.trivy_sha }}
        run: |
          tool_dir="$RUNNER_TEMP/trivy-bin"
          mkdir -p "$tool_dir"
          curl --fail --show-error --silent --location \
            "https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-$TRIVY_ARCH.tar.gz" \
            --output "$tool_dir/trivy.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA" "$tool_dir/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/trivy.tar.gz" -C "$tool_dir" trivy
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Download current vulnerability definitions and scan
        env:
          ARCH: ${{ matrix.arch }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/release-trivy-cache
        run: |
          # Fresh job-local cache: no restored database and no skip-update flag.
          trivy image --download-db-only --timeout 10m
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL \
            --exit-code 1 --timeout 10m "ac-man-release:$ARCH"
      - name: Export the checked image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p container-artifact
          docker save "ac-man-release:$ARCH" | gzip > "container-artifact/$ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-${{ matrix.arch }}
          path: container-artifact/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-container:
    name: Publish multi-architecture CLI package
    needs: [resolve, container, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # This fresh runner loads images as data; it never checks out or executes
    # project code. Only this job gets permission to publish container packages.
    permissions:
      actions: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: container-*
          path: incoming-containers
          merge-multiple: true
      - name: Validate images and publish the platform manifest
        env:
          GHCR_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Use a disposable Docker configuration; never persist the registry token.
          export DOCKER_CONFIG="$RUNNER_TEMP/package-docker-config"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf -- "$DOCKER_CONFIG"' EXIT
          for arch in amd64 arm64; do
            archive="incoming-containers/$arch.tar.gz"
            test -f "$archive" && test ! -L "$archive"
            docker load --input "$archive"
            docker image inspect "ac-man-release:$arch" | jq --exit-status \
              --arg arch "$arch" --arg commit "$RELEASE_COMMIT" --arg tag "$RELEASE_TAG" \
              'length == 1 and .[0].Os == "linux" and .[0].Architecture == $arch
               and .[0].Config.Labels["org.opencontainers.image.revision"] == $commit
               and .[0].Config.Labels["org.opencontainers.image.version"] == $tag' >/dev/null
          done
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          refs=()
          for arch in amd64 arm64; do
            # Run-scoped staging tags avoid cross-run races. The release tag points
            # at an index of immutable digests, not these mutable platform tags.
            staging="$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            docker tag "ac-man-release:$arch" "$staging"
            docker push "$staging"
            digest=$(docker image inspect "$staging" --format '{{index .RepoDigests 0}}')
            [[ "$digest" == "$image@sha256:"* ]]
            refs+=("$digest")
          done
          docker manifest create "$image:$RELEASE_TAG" "${refs[@]}"
          docker manifest push "$image:$RELEASE_TAG"
          docker manifest inspect "$image:$RELEASE_TAG" | jq --exit-status \
            '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          printf '### CLI container package\n\n`docker pull %s:%s`\n\nPlatforms: Linux amd64 and arm64.\n' \
            "$image" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

  sign-app:
    name: Sign and notarize macOS application
    needs: [resolve, checks]
    runs-on: macos-15
    timeout-minutes: 55
    environment: macos-release
    permissions:
      contents: read
      actions: read
    # Consume the app built by CI in this run only after all checks pass.
    # This fresh runner never checks out, builds, or executes the selected tag's
    # code. Packaging tools come only from the trusted workflow revision.
    # Only this job receives Apple credentials, through environment secrets.
    steps:
      - name: Check out trusted packaging tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/dmg
            scripts/package-dmg.sh
          sparse-checkout-cone-mode: false
      - name: Install hash-pinned DMG packaging tools
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-tools"
          "$RUNNER_TEMP/dmg-tools/bin/pip" install --require-hashes --only-binary=:all: -r scripts/dmg/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-app-aarch64-apple-darwin
          path: incoming
      - name: Validate and unpack the application archive
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          archive="$GITHUB_WORKSPACE/incoming/ac-man-macos-$RELEASE_TAG-aarch64-apple-darwin.zip"
          # Reject archive traversal, links, special files, and oversized inputs
          # before extracting. Treat build artifacts as data, never shell code.
          python3 - "$archive" <<'PY'
          import pathlib, stat, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              entries = archive.infolist()
              if len(entries) > 2000 or sum(e.file_size for e in entries) > 200 * 1024 * 1024:
                  raise SystemExit("Application archive exceeds release limits")
              names = set()
              for entry in entries:
                  path = pathlib.PurePosixPath(entry.filename)
                  mode = stat.S_IFMT(entry.external_attr >> 16)
                  name = entry.filename.rstrip('/').casefold()
                  if (path.is_absolute() or '..' in path.parts or '\\' in entry.filename
                          or name in names or mode not in (0, stat.S_IFREG, stat.S_IFDIR)):
                      raise SystemExit("Unsafe application archive entry")
                  names.add(name)
          PY
          mkdir -p signed-dist release-assets
          ditto -x -k "$archive" signed-dist
          test -f 'signed-dist/ac-man.app/Contents/Info.plist'
          test -x 'signed-dist/ac-man.app/Contents/MacOS/AcMan'
      - name: Sign with Developer ID, notarize, and staple the ticket
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_API_PRIVATE_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing $name in the macos-release environment. See docs/macos-release.md."
              exit 1
            fi
          done
          signing_dir=$(mktemp -d "$RUNNER_TEMP/midea-signing.XXXXXX")
          keychain="$signing_dir/signing.keychain-db"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf -- "$signing_dir"
          }
          trap cleanup EXIT
          keychain_password=$(openssl rand -hex 32)
          printf '::add-mask::%s\n' "$keychain_password"
          python3 - "$signing_dir/certificate.p12" <<'PY'
          import base64, os, pathlib, sys
          encoded = ''.join(os.environ['MACOS_CERTIFICATE_P12'].split())
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(encoded, validate=True))
          PY
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$signing_dir/AuthKey.p8"
          echo "Creating the temporary signing Keychain"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # codesign also resolves the private key through the user search list,
          # even when its --keychain option names the certificate's Keychain.
          # This job runs on a fresh, disposable GitHub-hosted runner.
          security list-keychains -d user -s "$keychain"
          echo "Importing the Developer ID certificate and private key"
          security import "$signing_dir/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          echo "Authorizing codesign to use the imported key"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          echo "Validating the Developer ID signing identity"
          security find-identity -v -p codesigning "$keychain" > "$signing_dir/identities.txt"
          identity=$(python3 - "$signing_dir/identities.txt" <<'PY'
          import pathlib, re, sys
          identities = re.findall(r'\b([A-Fa-f0-9]{40}) "Developer ID Application: [^"]+"',
                                  pathlib.Path(sys.argv[1]).read_text())
          if len(identities) != 1:
              raise SystemExit("The P12 must contain exactly one valid Developer ID Application identity and its private key")
          print(identities[0])
          PY
          )
          app="$GITHUB_WORKSPACE/signed-dist/ac-man.app"
          # The app has one executable with the Rust library linked statically;
          # there are no nested helpers or frameworks needing separate signing.
          echo "Signing the application with Developer ID"
          codesign --force --timestamp --options runtime --keychain "$keychain" \
            --sign "$identity" "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "$signing_dir/submission.zip"
          echo "Submitting the signed application to Apple for notarization"
          xcrun notarytool submit "$signing_dir/submission.zip" \
            --key "$signing_dir/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 20m \
            --output-format json > "$signing_dir/notarization.json"
          python3 - "$signing_dir/notarization.json" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if result.get('status') != 'Accepted':
              raise SystemExit("Apple did not accept notarization; nothing will be published. Submission: "
                               + str(result.get('id', 'unknown')))
          print("Apple accepted notarization. Submission: " + str(result['id']))
          PY
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose=2 "$app"
          dmg="$GITHUB_WORKSPACE/release-assets/ac-man-app-$RELEASE_TAG-macos-apple-silicon.dmg"
          DMGBUILD="$RUNNER_TEMP/dmg-tools/bin/dmgbuild" ./scripts/package-dmg.sh "$app" "$dmg"
          echo "Signing and notarizing the drag-to-Applications disk image"
          codesign --force --timestamp --keychain "$keychain" --sign "$identity" "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$signing_dir/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 20m \
            --output-format json > "$signing_dir/dmg-notarization.json"
          python3 - "$signing_dir/dmg-notarization.json" <<'PYDMG'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if result.get('status') != 'Accepted':
              raise SystemExit("Apple did not accept the disk image; nothing will be published. Submission: "
                               + str(result.get('id', 'unknown')))
          print("Apple accepted disk image notarization. Submission: " + str(result['id']))
          PYDMG
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          codesign --verify --strict "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          hdiutil verify "$dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-app-aarch64-apple-darwin
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish checked archives
    needs: [resolve, cli, sign-app, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job can write a release. It never checks out or executes project code.
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-app-aarch64-apple-darwin
          path: release-assets
      - name: Verify archives and record their source
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          cd release-assets
          # Fixed expected names avoid publishing arbitrary extra build output.
          archives=(
            "ac-man-$RELEASE_TAG-x86_64-unknown-linux-gnu.tar.gz"
            "ac-man-$RELEASE_TAG-aarch64-apple-darwin.tar.gz"
            "ac-man-$RELEASE_TAG-x86_64-apple-darwin.tar.gz"
            "ac-man-app-$RELEASE_TAG-macos-apple-silicon.dmg"
          )
          for archive in "${archives[@]}"; do
            test -f "$archive"
            test ! -L "$archive"
          done
          sha256sum -- "${archives[@]}" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          printf 'tag=%s\ncommit=%s\nrun=%s/%s/actions/runs/%s\n' \
            "$RELEASE_TAG" "$RELEASE_COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > SOURCE.txt
          printf 'packaging_commit=%s\n' "$GITHUB_WORKFLOW_SHA" >> SOURCE.txt
          printf 'macos_app=Developer ID signed, notarized, and stapled\nmacos_dmg=Developer ID signed, notarized, and stapled\n' >> SOURCE.txt
      - name: Ensure tag has not moved and create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          object_type=$(jq -r '.object.type' <<< "$ref")
          object_sha=$(jq -r '.object.sha' <<< "$ref")
          notes_object_type=$object_type
          notes_object_sha=$object_sha
          # Annotated tags (including nested tags) must resolve to the same tested commit.
          for _ in {1..10}; do
            [[ "$object_type" == tag ]] || break
            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")
            object_type=$(jq -r '.object.type' <<< "$ref")
            object_sha=$(jq -r '.object.sha' <<< "$ref")
          done
          if [[ "$object_type" != commit || "$object_sha" != "$RELEASE_COMMIT" ]]; then
            echo 'Tag changed after validation; refusing to publish. Start a new release run.' >&2
            exit 1
          fi
          # --notes-from-tag requires a local Git checkout and cannot be used
          # with --repo. Read the verified tag's message through the API instead.
          notes_file="$RUNNER_TEMP/release-notes.md"
          if [[ "$notes_object_type" == tag ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$notes_object_sha" --jq '.message' > "$notes_file"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/commits/$RELEASE_COMMIT" --jq '.message' > "$notes_file"
          fi
          python3 - "$notes_file" <<'PYNOTES'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          # Signed tag annotations include the signature after their prose.
          notes = re.split(r'\n-----BEGIN (?:PGP|SSH) SIGNATURE-----', path.read_text(), maxsplit=1)[0]
          path.write_text(notes.rstrip() + '\n')
          PYNOTES
          cd release-assets
          gh release create "$RELEASE_TAG" \
            "ac-man-$RELEASE_TAG-x86_64-unknown-linux-gnu.tar.gz#Terminal CLI (Linux x86_64) — tar.gz" \
            "ac-man-$RELEASE_TAG-aarch64-apple-darwin.tar.gz#Terminal CLI (Mac, Apple Silicon) — tar.gz" \
            "ac-man-$RELEASE_TAG-x86_64-apple-darwin.tar.gz#Terminal CLI (Mac, Intel) — tar.gz" \
            "ac-man-app-$RELEASE_TAG-macos-apple-silicon.dmg#Menu-bar app installer (Mac, Apple Silicon) — DMG" \
            SHA256SUMS SOURCE.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$RELEASE_COMMIT" \
            --title "$RELEASE_TAG" --notes-file "$notes_file"
