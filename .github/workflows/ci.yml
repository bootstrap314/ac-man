name: Tests and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Exact commit to check when called by the release workflow
        type: string
        required: true
      release_tag:
        description: Release archive label; standalone CI uses its commit SHA
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.revision || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: '1.98.1'

jobs:
  tests:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check with Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests without cloud credentials
        run: cargo test --locked --all-targets
      - name: Build CLI
        run: cargo build --release --locked --bin ac-man
      - name: Check CLI starts
        run: target/release/ac-man --help
      - name: Install pinned Apple build tools and generate notices
        if: matrix.runner == 'macos-15'
        run: |
          cargo install boltffi_cli --version 0.30.1 --locked
          cargo install cargo-about --version 0.9.1 --locked --features cli
          mkdir -p licenses
          cargo about generate --locked --fail --target aarch64-apple-darwin \
            -o licenses/DEPENDENCIES.html about.hbs
      - name: Test native controls
        if: runner.os == 'macOS'
        run: make test-native
      - name: Build Swift menu-bar application
        if: matrix.runner == 'macos-15'
        run: ./build.sh
      - name: Package the verified macOS application
        if: matrix.runner == 'macos-15'
        env:
          PACKAGE_TAG: ${{ inputs.release_tag || github.sha }}
        run: |
          codesign --verify --deep --strict 'dist/ac-man.app'
          ./scripts/package-release.sh app "$PACKAGE_TAG" aarch64-apple-darwin
      - name: Preserve the unsigned app for the signing job
        if: matrix.runner == 'macos-15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app-aarch64-apple-darwin
          path: release-assets/ac-man-macos-${{ inputs.release_tag || github.sha }}-aarch64-apple-darwin.zip
          if-no-files-found: error
          retention-days: 1

  security:
    name: Dependency, source, and container scans
    outputs:
      sarif_ready: ${{ steps.sarif.outputs.ready }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust and audit tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-about --version 0.9.1 --locked --features cli
      - name: Check Cargo.lock against the RustSec advisory database
        id: audit
        continue-on-error: true
        run: cargo audit --file Cargo.lock
      - name: Install checksum-pinned Trivy
        # SHA256 from the official immutable v0.76.0 Linux-64bit release asset.
        # Keep version and digest together when updating; never use an install-script pipe.
        run: |
          tool_dir="$RUNNER_TEMP/trivy-bin"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            'https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz' \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' 'e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7' "$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$tool_dir" trivy
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan source, dependencies, secrets, and configuration
        id: source_scan
        continue-on-error: true
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-sarif"
          trivy fs --format sarif --output "$RUNNER_TEMP/trivy-sarif/source.sarif" --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --exit-code 1 --timeout 10m --skip-dirs target --skip-dirs dist .
      - name: Build the non-root CLI container
        run: |
          mkdir -p licenses
          cargo about generate --locked --fail --target x86_64-unknown-linux-gnu \
            -o licenses/DEPENDENCIES.html about.hbs
          docker build --target runtime --tag ac-man:scan .
      - name: Scan the built container
        id: container_scan
        continue-on-error: true
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          trivy image --format sarif --output "$RUNNER_TEMP/trivy-sarif/container.sarif" --scanners vuln,secret --severity HIGH,CRITICAL \
            --exit-code 1 --timeout 10m ac-man:scan
      - name: Locate generated SARIF reports
        id: sarif
        if: ${{ always() && !cancelled() }}
        run: |
          if [[ -s "$RUNNER_TEMP/trivy-sarif/source.sarif" || -s "$RUNNER_TEMP/trivy-sarif/container.sarif" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve SARIF even when findings fail the scan
        if: ${{ always() && !cancelled() && steps.sarif.outputs.ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-sarif
          path: ${{ runner.temp }}/trivy-sarif/*.sarif
          if-no-files-found: error
          retention-days: 7
      - name: Enforce security results
        if: ${{ always() && !cancelled() }}
        env:
          AUDIT: ${{ steps.audit.outcome }}
          SOURCE_SCAN: ${{ steps.source_scan.outcome }}
          CONTAINER_SCAN: ${{ steps.container_scan.outcome }}
        run: |
          [[ "$AUDIT" == success && "$SOURCE_SCAN" == success && "$CONTAINER_SCAN" == success ]]

  upload-sarif:
    name: Publish Trivy code-scanning results
    needs: security
    # Fork PRs keep downloadable reports but do not receive a write token.
    # Release rechecks retain artifacts; avoid attributing tagged source to main.
    if: ${{ !cancelled() && inputs.revision == '' && needs.security.outputs.sarif_ready == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      # This isolated job never builds or executes project code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-sarif
          path: sarif-results
      - name: Upload source findings
        if: ${{ !cancelled() && hashFiles('sarif-results/source.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          sarif_file: sarif-results/source.sarif
          category: trivy-source
      - name: Upload container findings
        if: ${{ !cancelled() && hashFiles('sarif-results/container.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          sarif_file: sarif-results/container.sarif
          category: trivy-container
