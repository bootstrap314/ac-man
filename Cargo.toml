[package]
name = "ac-man"
version = "0.0.4"
edition = "2024"
publish = false
description = "Midea SmartHome cloud controller for macOS and the command line"
license = "Apache-2.0"
repository = "https://github.com/bootstrap314/ac-man"

[lib]
name = "ac_man"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "ac-man"
path = "src/main.rs"

[dependencies]
boltffi = "=0.30.1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"
