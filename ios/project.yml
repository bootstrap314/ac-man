name: AcMan
options:
  bundleIdPrefix: com.bootstrap314
  deploymentTarget:
    iOS: '17.0'
packages:
  AcManCore:
    path: ../generated/ios
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.0.4'
    CURRENT_PROJECT_VERSION: 1
targets:
  AcManIOS:
    type: application
    platform: iOS
    sources: [AcMan]
    dependencies:
      - package: AcManCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.bootstrap314.ac-man.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ac-man
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: '1'
  AcManTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AcManIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AcManUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AcManIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AcManIOS:
    build:
      targets:
        AcManIOS: all
    test:
      targets: [AcManTests, AcManUITests]
